# Trivy secret-scanning configuration.
#
# Secret scanning stays enabled on every build. This file contains exactly one
# narrowly scoped allow rule for a known upstream false positive: Synchronet
# ships a binary P6 pixmap demo asset whose raw pixel bytes happen to match the
# SendGrid API-token regular expression. No credential is present in that file.
# The rule is limited to that single path; every other secret rule and the
# all-severity fixable-vulnerability gate remain fully enabled.
allow-rules:
  - id: univiewer-demo-ppm-sendgrid-false-positive
    description: "Upstream binary demo pixmap that matches a token regex; not a credential"
    path: ^/?sbbs/dist/xtrn/univiewer/demo/univiewer_demo\.ppm$
