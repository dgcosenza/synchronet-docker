name: Daily Synchronet image

on:
  schedule:
    - cron: "45 4 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synchronet-image
  cancel-in-progress: false

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve current upstream versions
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git ls-remote https://github.com/SynchronetBBS/sbbs.git refs/heads/master | awk '{print $1}')"
          test "${#commit}" -eq 40
          version="$(python3 - "$commit" <<'PY'
          import sys
          import urllib.request
          commit = sys.argv[1]
          url = "https://raw.githubusercontent.com/SynchronetBBS/sbbs/" + commit + "/src/sbbs3/sbbsdefs.h"
          lines = urllib.request.urlopen(url, timeout=30).read().decode().splitlines()
          major_minor = next(line.split('"')[1] for line in lines if line.startswith("#define VERSION"))
          revision = next(line.split("'")[1] for line in lines if line.startswith("#define REVISION"))
          print(major_minor + revision)
          PY
          )"
          deno_tag="$(curl -fsSL https://api.github.com/repos/denoland/deno/releases/latest | jq -r .tag_name)"
          deno_version="$(printf '%s' "$deno_tag" | sed 's/^v//')"
          deno_sha256="$(curl -fsSL "https://github.com/denoland/deno/releases/download/v$deno_version/deno-x86_64-unknown-linux-gnu.zip.sha256sum" | awk '{print $1}')"
          test "${#deno_sha256}" -eq 64
          short_sha="$(printf '%s' "$commit" | cut -c1-7)"
          {
            echo "commit=$commit"
            echo "version=$version"
            echo "short_sha=$short_sha"
            echo "image_tag=$version-$short_sha"
            echo "deno_version=$deno_version"
            echo "deno_sha256=$deno_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Build linux/amd64 image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load \
            --build-arg SYNCHRONET_COMMIT="${{ steps.upstream.outputs.commit }}" \
            --build-arg SYNCHRONET_VERSION="${{ steps.upstream.outputs.version }}" \
            --build-arg DENO_VERSION="${{ steps.upstream.outputs.deno_version }}" \
            --build-arg DENO_SHA256="${{ steps.upstream.outputs.deno_sha256 }}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag synchronet-ci:daily .

      - name: Scan image for fixable critical and high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: synchronet-ci:daily
          version: v0.76.2
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Check for Docker Hub secrets
        id: hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub push skipped; configure the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN Actions secrets to enable publishing." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Log in to Docker Hub
        if: ${{ steps.hub.outputs.enabled == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish moving and immutable tags
        if: ${{ steps.hub.outputs.enabled == 'true' }}
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.upstream.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker tag synchronet-ci:daily dgcosenza/synchronet:nightly
          docker tag synchronet-ci:daily dgcosenza/synchronet:latest
          docker push dgcosenza/synchronet:nightly
          docker push dgcosenza/synchronet:latest
          if docker manifest inspect "dgcosenza/synchronet:$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Immutable tag already exists; leaving it unchanged: $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            docker tag synchronet-ci:daily "dgcosenza/synchronet:$IMAGE_TAG"
            docker push "dgcosenza/synchronet:$IMAGE_TAG"
          fi
          {
            echo "Built Synchronet $IMAGE_TAG."
            echo "Debian base: debian:trixie-slim, upgraded during this run."
            echo "Trivy scan passed with no fixable critical or high findings."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read Docker Hub short description
        if: ${{ steps.hub.outputs.enabled == 'true' }}
        id: short_desc
        shell: bash
        run: |
          set -euo pipefail
          DESC="$(tr -d '\r\n' < DOCKERHUB_SHORT_DESCRIPTION.txt)"
          if [ "${#DESC}" -gt 100 ]; then
            echo "ERROR: Docker Hub short description exceeds 100 characters (${#DESC})." >&2
            exit 1
          fi
          echo "text=${DESC}" >> "$GITHUB_OUTPUT"

      - name: Sync Docker Hub repository overview (short and full description)
        if: ${{ steps.hub.outputs.enabled == 'true' }}
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dgcosenza/synchronet
          short-description: ${{ steps.short_desc.outputs.text }}
          readme-filepath: ./README.md
